on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 17
          - java: 25
    steps:
    - uses: actions/checkout@v7
    - uses: sbt/setup-sbt@v1
    - uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
    - run: sbt
           -v
           --server
           scalafmtCheckRepo
           test
           scripted
